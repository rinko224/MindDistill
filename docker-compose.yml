version: "3.8"

services:
  backend:
    build: ./backend
    container_name: minddistill-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: minddistill-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
